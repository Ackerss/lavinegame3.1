<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aprendendo com Lavine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            touch-action: none; /* Impede zoom e scroll no tablet */
            overflow: hidden; /* Garante que nada crie barras de rolagem */
            background: linear-gradient(180deg, #E0C3FC 0%, #8EC5FC 100%);
            height: 100dvh; /* Altura dinâmica para mobile */
            width: 100vw;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .letter-slot {
            font-family: 'Fredoka One', cursive;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .slot-filled {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            border: 3px solid white !important;
            transform: scale(1.05);
        }

        .letter-bubble {
            position: absolute;
            font-family: 'Fredoka One', cursive;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            border: 3px solid white;
            touch-action: manipulation; 
            z-index: 20;
            will-change: transform, opacity;
            transition: transform 0.2s, opacity 0.2s;
        }

        .floating {
            animation: float 3s ease-in-out infinite;
        }

        .hint-active {
            animation: bounceHint 1s infinite !important;
            box-shadow: 0 0 30px #fbbf24 !important;
            border-color: #fbbf24 !important;
            z-index: 30 !important;
        }

        @keyframes bounceHint {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.2) translateY(-15px); }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translateX(-4px); }
            20%, 80% { transform: translateX(4px); }
            30%, 50%, 70% { transform: translateX(-8px); }
            40%, 60% { transform: translateX(8px); }
        }

        .pop-in {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .highlight-slot {
            border-color: #ec4899 !important;
            background-color: #fce7f3 !important;
            transform: scale(1.05); 
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.6);
            z-index: 10;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.4); transform: scale(1.05); }
            50% { transform: scale(1.1); }
            70% { box-shadow: 0 0 0 10px rgba(236, 72, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); transform: scale(1.05); }
        }
        
        .correct-hit {
            transition: transform 0.3s ease-out, opacity 0.3s ease-in;
            transform: scale(2.0) rotate(20deg) !important;
            opacity: 0 !important;
            background-color: #22c55e !important;
        }

        #loadingOverlay {
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 999;
        }

        #play-area-container {
            position: relative;
            width: 100%;
            flex-grow: 1;
            overflow: hidden;
        }

        #feedbackOverlay {
            transition: background-color 0.4s ease;
        }
        
        @media (max-height: 600px) {
            #header-container {
                padding-top: 0.5rem;
                padding-bottom: 0.5rem;
            }
            .letter-slot {
                 height: 14vw !important;
            }
        }

        /* NOVO: Classe para a palavra final gigante */
        .hero-word {
            text-shadow: 4px 4px 0px rgba(0,0,0,0.1);
            background: -webkit-linear-gradient(#ec4899, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: heroPulse 2s infinite ease-in-out;
        }

        @keyframes heroPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center" onclick="globalTouchEffect(event)">

    <!-- Tela Inicial -->
    <div id="startScreen" class="absolute inset-0 z-50 bg-white/95 backdrop-blur-md flex flex-col items-center justify-center p-4 text-center">
        <div class="mb-6 animate-bounce text-8xl">👧🏻</div>
        <h1 class="text-4xl md:text-6xl font-extrabold text-gray-800 mb-2 font-['Fredoka_One']">
            Oi, <span class="text-pink-500">Lavine</span>!
        </h1>
        <p class="text-2xl text-gray-500 mb-10 font-bold">Vamos brincar?</p>
        
        <button onclick="startGame()" class="w-64 h-24 bg-gradient-to-b from-pink-400 to-pink-600 hover:from-pink-500 hover:to-pink-700 text-white text-4xl rounded-3xl shadow-[0_8px_0_rgb(190,24,93)] active:shadow-[0_0px_0_rgb(190,24,93)] active:translate-y-2 transition-all font-bold flex items-center justify-center gap-3">
            <span>JOGAR</span> 🔊
        </button>
        <p class="mt-6 text-gray-400 text-base">Toque para ligar o som</p>
    </div>

    <!-- Área do Jogo -->
    <div id="gameArea" class="w-full h-full flex flex-col hidden relative">
        
        <!-- Cabeçalho Fixo -->
        <div id="header-container" class="flex-none pt-4 pb-2 px-2 flex flex-col items-center z-30 bg-white/40 backdrop-blur-md shadow-sm border-b border-white/20">
            <div class="flex items-center gap-3 mb-2 bg-white px-5 py-2 rounded-full shadow-lg transform scale-90 md:scale-100 transition-transform" id="header-target">
                <span class="text-gray-400 font-bold text-sm md:text-base uppercase tracking-wide mr-1">Ache o:</span>
                <span id="target-emoji-display" class="text-4xl md:text-5xl drop-shadow-sm">👧🏻</span>
                <div class="w-0.5 h-10 bg-gray-200 mx-1"></div>
                <span id="target-letter-display" class="text-5xl md:text-6xl font-['Fredoka_One'] text-pink-600 font-bold drop-shadow-sm">L</span>
            </div>
            
            <div id="slots-container" class="flex flex-nowrap gap-1 md:gap-2 justify-center items-center px-1 min-h-[70px] w-full max-w-4xl">
                <!-- Slots dinâmicos -->
            </div>
        </div>

        <!-- Área de Brincar -->
        <div id="play-area-container">
            <div id="play-area" class="absolute inset-0 w-full h-full">
                <!-- Fundo decorativo -->
                <div class="absolute inset-0 flex items-center justify-center opacity-10 pointer-events-none z-0">
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="w-full h-full fill-pink-400">
                        <path d="M44.7,-76.4C58.9,-69.2,71.8,-59.1,81.6,-46.6C91.4,-34.1,98.1,-19.2,95.8,-5.3C93.5,8.6,82.2,21.4,71.3,32.2C60.4,43,49.9,51.8,38.3,60.2C26.7,68.6,14,76.6,-0.4,77.3C-14.8,78,-31.2,71.4,-44.2,62C-57.2,52.6,-66.8,40.4,-73.6,26.9C-80.4,13.4,-84.4,-1.4,-80.4,-14.8C-76.4,-28.2,-64.4,-40.2,-51.8,-47.9C-39.2,-55.6,-26,-59,-12.8,-61.3C0.4,-63.6,13.6,-64.8,30.5,-83.6L44.7,-76.4Z" transform="translate(100 100)" />
                    </svg>
                </div>
            </div>
        </div>

        <!-- Overlay de Feedback Centralizado -->
        <div id="feedbackOverlay" class="hidden absolute inset-0 z-40 flex items-center justify-center bg-black/50 backdrop-blur-sm pointer-events-none">
            <div id="feedbackLetter" class="text-white text-9xl md:text-[14rem] font-['Fredoka_One'] drop-shadow-lg scale-0 transition-transform duration-300"></div>
        </div>

        <!-- Tela de Vitória (ATUALIZADA) -->
        <div id="winScreen" class="hidden absolute inset-0 z-50 bg-black/60 backdrop-blur-md flex flex-col items-center justify-center text-center p-4">
            <div class="bg-white p-6 md:p-8 rounded-[2.5rem] shadow-2xl max-w-md w-full mx-4 relative overflow-hidden border-8 border-pink-100">
                <div class="absolute top-0 left-0 w-full h-5 bg-gradient-to-r from-pink-400 via-purple-400 to-blue-400"></div>
                
                <!-- Emoji de Vitória -->
                <div id="winEmojiDisplay" class="text-8xl md:text-9xl mb-4 animate-bounce mt-4 drop-shadow-md">🎉</div>
                
                <p class="text-3xl font-['Fredoka_One'] text-pink-400 mb-1">PARABÉNS!</p>
                <p class="text-xl text-gray-400 font-bold mb-2">Você escreveu:</p>
                
                <!-- PALAVRA FINAL GIGANTE -->
                <div id="finalWordContainer" class="mb-8 py-2">
                    <p id="winWord" class="hero-word text-7xl md:text-8xl font-['Fredoka_One'] leading-none tracking-wide">PAI</p>
                </div>
                
                <button onclick="getNewWords()" class="w-full py-5 bg-gradient-to-r from-purple-500 to-indigo-600 hover:from-purple-600 hover:to-indigo-700 text-white text-2xl rounded-2xl shadow-xl active:scale-95 font-bold flex items-center justify-center gap-3 transition-all border-b-4 border-indigo-800 mb-4">
                    ✨ Próxima Palavra
                </button>
                
                <button onclick="resetGame(true)" class="w-full py-3 bg-gray-100 text-gray-500 text-lg rounded-xl active:scale-95 font-bold transition-all hover:bg-gray-200 hover:text-gray-700">
                    Jogar "LAVINE" de Novo
                </button>
            </div>
        </div>

        <!-- Tela de Loading -->
        <div id="loadingOverlay" class="hidden absolute inset-0 flex-col items-center justify-center text-white text-xl md:text-2xl font-bold">
            <div class="animate-spin rounded-full h-20 w-20 border-8 border-white border-t-transparent mb-6"></div>
            <p id="loadingText" class="font-['Fredoka_One'] text-3xl drop-shadow-md">Buscando...</p>
        </div>
    </div>

    <script>
        const defaultName = ['L', 'A', 'V', 'I', 'N', 'E'];
        let targetName = [...defaultName];
        let currentEmoji = '👧🏻'; 
        // NOVO: Objeto para guardar a palavra atual inteira e sua pronúncia
        let currentWordObj = { palavra: "LAVINE", emoji: "👧🏻", pronuncia: "LAVÍNE" };

        const colors = [
            'bg-pink-500 border-pink-300', 
            'bg-purple-500 border-purple-300', 
            'bg-blue-500 border-blue-300', 
            'bg-orange-500 border-orange-300', 
            'bg-green-500 border-green-300', 
            'bg-red-500 border-red-300'
        ];
        
        let currentStep = 0;
        let synth = window.speechSynthesis;
        let audioCtx;
        let idleHintTimer; 
        let isProcessingInput = false; 

        function globalTouchEffect(e) {
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            
            if (x && y && !isProcessingInput) {
                confetti({
                    particleCount: 8,
                    spread: 30,
                    startVelocity: 15,
                    origin: { x: x / window.innerWidth, y: y / window.innerHeight },
                    colors: ['#FFD700', '#FF69B4', '#00CED1'],
                    disableForReducedMotion: true,
                    gravity: 0.5,
                    ticks: 50
                });
            }
            resetIdleHintTimer();
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().catch(e => console.log("Audio resume failed:", e));
            }
        }

        function speak(text, priority = false) {
            if (priority) synth.cancel();
            const utterThis = new SpeechSynthesisUtterance(text);
            utterThis.lang = 'pt-BR';
            utterThis.rate = 1.0;
            utterThis.pitch = 1.2;
            const voices = synth.getVoices();
            const ptVoice = voices.find(v => v.lang.includes('pt-BR')) || voices.find(v => v.lang.includes('pt'));
            if (ptVoice) utterThis.voice = ptVoice;
            synth.speak(utterThis);
        }

        function playSound(type) {
            if (!audioCtx) initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1318.51, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            } else if (type === 'pop') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        function getBubbleSize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const minDim = Math.min(w, h);
            if (minDim < 400) return 75; 
            if (minDim < 600) return 90; 
            if (minDim < 900) return 100; 
            return 110; 
        }

        function isOverlappingRects(rect1, rect2, padding) {
            return (
                rect1.x < rect2.x + rect2.width + padding &&
                rect1.x + rect1.width + padding > rect2.x &&
                rect1.y < rect2.y + rect2.height + padding &&
                rect1.y + rect1.height + padding > rect2.y
            );
        }
        
        function findSafePosition(placedRects, containerRect, elSize) {
            const padding = 20; 
            const elementPadding = 15; 
            const maxX = containerRect.width - elSize - padding;
            const maxY = containerRect.height - elSize - padding;
            if (maxX <= 0 || maxY <= 0) return null;
            let newRect;
            let isOverlapping = true;
            let attempts = 0;
            const maxAttempts = 150;
            while (isOverlapping && attempts < maxAttempts) {
                attempts++;
                const x = Math.floor(Math.random() * (maxX - padding)) + padding;
                const y = Math.floor(Math.random() * (maxY - padding)) + padding;
                newRect = { x, y, width: elSize, height: elSize };
                isOverlapping = false;
                for (const rect of placedRects) {
                    if (isOverlappingRects(newRect, rect, elementPadding)) { 
                        isOverlapping = true;
                        break;
                    }
                }
            }
            if (attempts >= maxAttempts) { 
                const cols = Math.floor(containerRect.width / (elSize + 5));
                const index = placedRects.length;
                const row = Math.floor(index / cols);
                const col = index % cols;
                newRect = {
                    x: padding + (col * (elSize + 5)),
                    y: padding + (row * (elSize + 5)),
                    width: elSize,
                    height: elSize
                };
            }
            return newRect;
        }

        function spawnBubbles() {
            const playArea = document.getElementById('play-area');
            const existingBubbles = playArea.querySelectorAll('.letter-bubble');
            existingBubbles.forEach(b => b.remove());

            if (playArea.querySelector('svg') === null) {
                playArea.innerHTML = `<div class="absolute inset-0 flex items-center justify-center opacity-10 pointer-events-none z-0">
                        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="w-full h-full fill-pink-400">
                            <path d="M44.7,-76.4C58.9,-69.2,71.8,-59.1,81.6,-46.6C91.4,-34.1,98.1,-19.2,95.8,-5.3C93.5,8.6,82.2,21.4,71.3,32.2C60.4,43,49.9,51.8,38.3,60.2C26.7,68.6,14,76.6,-0.4,77.3C-14.8,78,-31.2,71.4,-44.2,62C-57.2,52.6,-66.8,40.4,-73.6,26.9C-80.4,13.4,-84.4,-1.4,-80.4,-14.8C-76.4,-28.2,-64.4,-40.2,-51.8,-47.9C-39.2,-55.6,-26,-59,-12.8,-61.3C0.4,-63.6,13.6,-64.8,30.5,-83.6L44.7,-76.4Z" transform="translate(100 100)" />
                        </svg>
                    </div>`;
            }

            const containerRect = playArea.getBoundingClientRect();
            const elSize = getBubbleSize();
            const placedRects = [];

            let lettersData = targetName.map((char, i) => ({ 
                char, 
                color: colors[i % colors.length]
            }));
            lettersData.sort(() => Math.random() - 0.5);

            lettersData.forEach((item) => {
                const newRect = findSafePosition(placedRects, containerRect, elSize);
                if (newRect) {
                    placedRects.push(newRect);
                    const bubble = document.createElement('div');
                    bubble.textContent = item.char;
                    bubble.dataset.char = item.char;
                    bubble.className = `letter-bubble floating ${item.color}`;
                    bubble.style.width = `${elSize}px`;
                    bubble.style.height = `${elSize}px`;
                    bubble.style.fontSize = `${elSize * 0.55}px`;
                    bubble.style.left = `${newRect.x}px`;
                    bubble.style.top = `${newRect.y}px`;
                    bubble.style.animationDelay = `-${Math.random() * 3}s`;
                    const handleInteraction = (e) => {
                        e.preventDefault(); 
                        e.stopPropagation();
                        globalTouchEffect(e); 
                        handleInput(item.char, bubble, item.color);
                    };
                    bubble.addEventListener('touchstart', handleInteraction, { passive: false });
                    bubble.addEventListener('mousedown', handleInteraction);
                    playArea.appendChild(bubble);
                }
            });
            resetIdleHintTimer(); 
            updateHUD();
        }

        function resetIdleHintTimer() {
            clearTimeout(idleHintTimer);
            document.querySelectorAll('.letter-bubble').forEach(b => b.classList.remove('hint-active'));
            if (!document.getElementById('gameArea').classList.contains('hidden') && !isProcessingInput) {
                idleHintTimer = setTimeout(showVisualHint, 6000); 
            }
        }

        // NOVO: Função para pegar o SOM da letra e não o nome técnico
        function getLetterSound(char) {
            const sounds = {
                'E': 'Ê',
                'O': 'Ó',
                'A': 'Á'
            };
            return sounds[char] || char;
        }

        function showVisualHint() {
            const currentLetter = targetName[currentStep];
            const correctBubble = Array.from(document.querySelectorAll('.letter-bubble'))
                .find(b => b.textContent === currentLetter);
            if (correctBubble && !isProcessingInput) {
                correctBubble.classList.add('hint-active');
                // CORREÇÃO: Usa getLetterSound para o narrador falar "Letra Ê"
                speak("Onde está a letra " + getLetterSound(currentLetter) + "?", true);
            }
        }
        
        function processFeedback(char, isCorrect, element, colorClass) {
            if (isProcessingInput) return;
            isProcessingInput = true;
            clearTimeout(idleHintTimer);
            synth.cancel(); 

            document.querySelectorAll('.letter-bubble').forEach(b => {
                b.style.opacity = '0';
                b.style.pointerEvents = 'none';
                b.classList.remove('floating', 'hint-active');
            });
            
            const feedbackOverlay = document.getElementById('feedbackOverlay');
            const feedbackLetter = document.getElementById('feedbackLetter');
            
            feedbackLetter.textContent = char;
            feedbackLetter.className = `text-white text-9xl md:text-[14rem] font-['Fredoka_One'] drop-shadow-lg transition-transform duration-300`;
            
            if (isCorrect) {
                feedbackLetter.classList.add('text-green-300', 'animate-pulse');
                feedbackOverlay.classList.remove('bg-black/50', 'bg-red-600/70');
                feedbackOverlay.classList.add('bg-green-600/70');
                // CORREÇÃO: Usa som da letra no acerto
                speak(`Acertou! ${getLetterSound(char)}`, true);
                playSound('success');
                element.classList.add('correct-hit');
                confetti({
                    particleCount: 30,
                    spread: 60,
                    origin: { y: 0.6 },
                    colors: ['#22c55e', '#ffffff', '#fbbf24'], 
                    startVelocity: 20,
                    gravity: 0.8,
                    ticks: 60
                });
            } else {
                feedbackLetter.classList.add('text-gray-300');
                feedbackOverlay.classList.remove('bg-black/50', 'bg-green-600/70');
                feedbackOverlay.classList.add('bg-red-600/70');
                // CORREÇÃO: Frase melhorada "Essa é a letra X" e som corrigido
                speak(`Essa é a letra ${getLetterSound(char)}!`, true); 
                playSound('pop'); 
                element.classList.remove('shake');
                void element.offsetWidth; 
                element.classList.add('shake');
            }

            feedbackOverlay.classList.remove('hidden');
            void feedbackLetter.offsetWidth; 
            feedbackLetter.classList.add('scale-100');

            const feedbackDuration = 1500; 

            setTimeout(() => {
                feedbackLetter.classList.remove('scale-100', 'animate-pulse');
                feedbackOverlay.classList.add('hidden');
                feedbackOverlay.classList.remove('bg-green-600/70', 'bg-red-600/70');
                feedbackOverlay.classList.add('bg-black/50'); 
                
                if(element.parentNode) element.parentNode.removeChild(element);

                if (isCorrect) {
                    const slot = document.getElementById(`slot-${currentStep}`);
                    slot.textContent = char;
                    slot.className = slot.className.replace(/bg-\w+-\d+/g, '').replace(/border-\w+-\d+/g, '');
                    slot.classList.add('slot-filled', 'pop-in', 'shadow-lg', 'text-white', colorClass.split(' ')[0]); 
                    slot.classList.remove('border-dashed', 'border-gray-300', 'text-gray-300'); 

                    currentStep++;

                    if (currentStep === targetName.length) {
                        setTimeout(winGame, 300);
                        return;
                    }
                } 
                spawnBubbles();
                isProcessingInput = false;
                if (currentStep < targetName.length) {
                    // CORREÇÃO: Som da próxima letra
                    setTimeout(() => speak("Onde está a letra " + getLetterSound(targetName[currentStep]) + "?"), 500);
                }
            }, feedbackDuration);
        }

        function handleInput(char, element, colorClass) {
            if (isProcessingInput) return; 
            const expectedChar = targetName[currentStep];
            const isCorrect = (char === expectedChar);
            processFeedback(char, isCorrect, element, colorClass);
        }

        function startGame() {
            initAudio();
            speak("");
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameArea').classList.remove('hidden');
            setTimeout(() => {
                resetGame(true);
                // CORREÇÃO: Usa o som da primeira letra
                setTimeout(() => speak("Vamos procurar a letra " + getLetterSound(targetName[0]) + "?"), 500);
            }, 100);
        }

        function resetGame(useDefaultName = false) {
            if (useDefaultName) {
                targetName = [...defaultName];
                currentEmoji = '👧🏻';
                currentWordObj = { palavra: "LAVINE", emoji: "👧🏻", pronuncia: "LAVÍNE" };
            }
            currentStep = 0;
            isProcessingInput = false;
            document.getElementById('winScreen').classList.add('hidden');
            document.getElementById('feedbackOverlay').classList.add('hidden'); 
            const slotsContainer = document.getElementById('slots-container');
            slotsContainer.innerHTML = '';
            const w = window.innerWidth;
            const isMobile = w < 600;
            let slotSizeClass;
            if (isMobile) {
                slotSizeClass = 'w-[13vw] h-[16vw] max-w-[60px] max-h-[80px] text-[8vw]';
            } else {
                slotSizeClass = 'w-20 h-24 text-6xl';
            }
            targetName.forEach((char, index) => {
                const slot = document.createElement('div');
                slot.id = `slot-${index}`;
                slot.className = `letter-slot ${slotSizeClass} border-4 border-dashed border-gray-300 rounded-xl flex items-center justify-center text-gray-300 font-bold`;
                slot.textContent = ""; 
                slotsContainer.appendChild(slot);
            });
            spawnBubbles();
        }

        function updateHUD() {
            document.querySelectorAll('.letter-slot').forEach((el, idx) => {
                el.classList.remove('highlight-slot', 'border-pink-500', 'border-solid', 'slot-filled');
                el.classList.add('border-dashed');
                if (idx === currentStep) {
                    el.classList.add('highlight-slot', 'border-pink-500');
                    el.classList.remove('border-dashed');
                    el.classList.add('border-solid');
                }
            });
            document.getElementById('target-emoji-display').textContent = currentEmoji;
            if (currentStep < targetName.length) {
                const letter = targetName[currentStep];
                const letterDisplay = document.getElementById('target-letter-display');
                letterDisplay.innerText = letter;
                letterDisplay.classList.remove('pop-in');
                void letterDisplay.offsetWidth;
                letterDisplay.classList.add('pop-in');
            }
        }

        function winGame() {
            clearTimeout(idleHintTimer);
            isProcessingInput = true;
            const word = targetName.join('');
            
            // CORREÇÃO: Usa a pronúncia correta da palavra inteira
            const pronunciation = currentWordObj.pronuncia || word;
            
            speak(`Parabéns! Você escreveu ${pronunciation}! Muito bem!`);
            playSound('success');
            
            document.getElementById('winEmojiDisplay').textContent = currentEmoji;
            document.getElementById('winWord').textContent = word; 
            document.getElementById('winScreen').classList.remove('hidden');
            
            const duration = 3000;
            const end = Date.now() + duration;
            (function frame() {
                confetti({
                    particleCount: 5, angle: 60, spread: 55, origin: { x: 0 },
                    colors: ['#ec4899', '#a855f7', '#fbbf24']
                });
                confetti({
                    particleCount: 5, angle: 120, spread: 55, origin: { x: 1 },
                    colors: ['#ec4899', '#a855f7', '#fbbf24']
                });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        // CORREÇÃO: Adicionado campo 'pronuncia' para forçar o som correto
        const wordList = [
            { palavra: "SOL", emoji: "☀️" },
            { palavra: "LUA", emoji: "🌙" },
            { palavra: "PAI", emoji: "👨‍👧" },
            { palavra: "MAE", emoji: "👩‍👧", pronuncia: "MÃE" },
            { palavra: "UVA", emoji: "🍇" },
            { palavra: "OVO", emoji: "🥚" },
            { palavra: "CEU", emoji: "☁️", pronuncia: "CÉU" },
            { palavra: "RIO", emoji: "💧" },
            { palavra: "GOL", emoji: "⚽" },
            { palavra: "FLOR", emoji: "🌸" },
            { palavra: "GATO", emoji: "🐈" },
            { palavra: "BOLA", emoji: "⚽" },
            { palavra: "PATO", emoji: "🦆" },
            { palavra: "SAPO", emoji: "🐸" },
            { palavra: "CASA", emoji: "🏡" },
            { palavra: "BEBE", emoji: "👶", pronuncia: "BEBÊ" },
            { palavra: "DADO", emoji: "🎲" },
            { palavra: "BOLO", emoji: "🍰" },
            { palavra: "LEAO", emoji: "🦁", pronuncia: "LEÃO" }
        ];

        let lastWordIndex = -1;

        async function getNewWords() {
            document.getElementById('loadingOverlay').classList.remove('hidden');
            document.getElementById('loadingOverlay').classList.add('flex');
            await new Promise(resolve => setTimeout(resolve, 800));
            let newIndex = -1;
            do {
                newIndex = Math.floor(Math.random() * wordList.length);
            } while (wordList.length > 1 && newIndex === lastWordIndex); 
            lastWordIndex = newIndex;
            const randomItem = wordList[newIndex];
            
            // Atualiza o objeto da palavra atual
            currentWordObj = randomItem;
            targetName = randomItem.palavra.toUpperCase().split('');
            currentEmoji = randomItem.emoji;
            
            resetGame(false); 
            document.getElementById('loadingOverlay').classList.add('hidden');
            document.getElementById('loadingOverlay').classList.remove('flex');
            
            // CORREÇÃO: Usa a pronúncia correta na introdução
            const pronunciation = randomItem.pronuncia || randomItem.palavra;
            speak(`Agora vamos achar: ${pronunciation}`);
        }

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (!document.getElementById('gameArea').classList.contains('hidden') && 
                    document.getElementById('winScreen').classList.contains('hidden') &&
                    !isProcessingInput) {
                      spawnBubbles(); 
                }
            }, 200);
        });
    </script>
</body>
</html>
